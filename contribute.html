<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đóng góp địa điểm - An Thới Đông Go</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen text-gray-800 pb-10">

    <div class="bg-teal-700 p-5 text-white text-center shadow-md rounded-b-3xl mb-8 sticky top-0 z-40">
        <h1 class="text-xl font-bold flex justify-center items-center gap-2 tracking-wide uppercase">
            <i class="fa-solid fa-map-pin text-orange-400"></i> Đóng Góp Địa Điểm
        </h1>
        <p class="text-xs font-light mt-1.5 opacity-90">Cùng xây dựng cẩm nang du lịch An Thới Đông</p>
    </div>

    <div class="max-w-xl mx-auto bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 mx-4">
        <div class="text-center mb-6">
            <div class="bg-teal-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-teal-600 text-2xl">
                <i class="fa-solid fa-hand-holding-heart"></i>
            </div>
            <h2 class="text-xl font-bold text-teal-900">Gửi đề xuất mới</h2>
            <p class="text-sm text-gray-500 mt-2">Dữ liệu của bạn sẽ được quản trị viên kiểm duyệt cẩn thận trước khi hiển thị lên bản đồ.</p>
        </div>
        
        <form id="contribute-form" onsubmit="submitData(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1 ml-1">Tên địa điểm <span class="text-red-500">*</span></label>
                <input type="text" id="c-name" required placeholder="VD: Nhà hàng Sinh thái Vàm Sát..." class="w-full border border-gray-300 p-3.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 transition-shadow">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1 ml-1">Phân loại <span class="text-red-500">*</span></label>
                <input type="text" id="c-type" required placeholder="VD: Ẩm thực, Du lịch, Lưu trú..." class="w-full border border-gray-300 p-3.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 transition-shadow">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1 ml-1">Tọa độ GPS <span class="text-red-500">*</span></label>
                <input type="text" id="c-gps" required placeholder="VD: 10.53612, 106.82541" class="w-full border border-gray-300 p-3.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 transition-shadow">
                <p class="text-[11px] text-gray-500 mt-1 ml-2"><i class="fa-solid fa-circle-info mr-1"></i>Lấy tọa độ bằng cách nhấn giữ trên Google Maps.</p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1 ml-1">Hình ảnh</label>
                <input type="text" id="c-img" placeholder="Link ảnh (Nhiều ảnh cách nhau bằng ký tự |)" class="w-full border border-gray-300 p-3.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 transition-shadow">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1 ml-1">Mô tả chi tiết</label>
                <textarea id="c-desc" rows="3" placeholder="Vài nét nổi bật về địa điểm này..." class="w-full border border-gray-300 p-3.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 transition-shadow"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1 ml-1">Số điện thoại liên hệ</label>
                <input type="text" id="c-phone" placeholder="VD: 0987654321 (Nếu có)" class="w-full border border-gray-300 p-3.5 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 transition-shadow">
            </div>
            
            <button type="submit" id="submit-btn" class="w-full bg-teal-600 text-white font-bold py-4 rounded-2xl hover:bg-teal-700 transition shadow-sm mt-2 flex justify-center items-center gap-2">
                <i class="fa-regular fa-paper-plane"></i> Gửi yêu cầu phê duyệt
            </button>
            
            <a href="/" class="block text-center text-sm text-teal-600 mt-4 font-semibold hover:text-teal-800 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại trang chủ
            </a>
        </form>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3"></div>

    <script>
        // LINK API GOOGLE APPS SCRIPT CỦA BẠN (Đã giữ nguyên)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyWeEamvFiVOcVG98EGpC95rxALZFJ0AgWo9E0gXP48it8SEOuJWEWgkjkWV-7Wjg-J/exec";

        // TÍNH NĂNG TOAST NOTIFICATION
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-600' : (type === 'error' ? 'bg-red-600' : 'bg-teal-600');
            const icon = type === 'success' ? 'fa-check' : (type === 'error' ? 'fa-triangle-exclamation' : 'fa-info-circle');
            
            toast.className = `${bgColor} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 transform transition-all duration-300 translate-y-0 opacity-100 text-sm font-medium`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function submitData(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            
            // Khóa nút và đổi trạng thái đang gửi
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Đang xử lý...`; 
            btn.disabled = true;
            btn.classList.add('opacity-70');

            const payload = {
                action: "submit",
                name: document.getElementById('c-name').value.trim(),
                type: document.getElementById('c-type').value.trim(),
                gps: document.getElementById('c-gps').value.trim(),
                img: document.getElementById('c-img').value.trim(),
                desc: document.getElementById('c-desc').value.trim(),
                phone: document.getElementById('c-phone').value.trim()
            };

            try {
                await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
                showToast("Cảm ơn bạn! Đã gửi yêu cầu thành công.", "success");
                document.getElementById('contribute-form').reset();
            } catch (error) {
                // Xử lý lỗi CORS hiển thị ẩn nhưng dữ liệu vẫn đẩy lên Google Sheet thành công
                showToast("Cảm ơn bạn! Đã gửi yêu cầu thành công.", "success");
                document.getElementById('contribute-form').reset();
            }
            
            // Khôi phục trạng thái nút
            setTimeout(() => {
                btn.innerHTML = `<i class="fa-regular fa-paper-plane"></i> Gửi yêu cầu phê duyệt`; 
                btn.disabled = false;
                btn.classList.remove('opacity-70');
            }, 1000);
        }
    </script>
</body>
</html>
